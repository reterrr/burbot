services:
  temporal:
    image: temporalio/temporal
    container_name: burbot-temporal
    user: "0:0" # tylko lokalne środowisko developerskie
    command:
      - server
      - start-dev
      - --ip
      - 0.0.0.0
      - --db-filename
      - /data/temporal.db
    ports:
      - "7233:7233"
      - "8233:8233"
    volumes:
      - temporal-data:/data
    restart: unless-stopped


  db-business:
    image: postgres:18.0
    container_name: burbot-db-business
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "${POSTGRES_PORT}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql
volumes:
  temporal-data:
  postgres-data: