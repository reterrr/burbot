services:
  bot:
    container_name: bot
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
      - "5678:5678"
    networks:
      - burbot
    depends_on:
      temporal:
        condition: service_started
      db:
        condition: service_healthy
    command:
      - python
      - -m
      - debugpy
      - --listen
      - 0.0.0.0:5678
      - -m
      - business_layer.main

  temporal:
    image: temporalio/temporal
    container_name: burbot-temporal
    user: "0:0" # tylko lokalne środowisko developerskie
    command:
      - server
      - start-dev
      - --ip
      - 0.0.0.0
      - --db-filename
      - /data/temporal.db
    ports:
      - "7233:7233"
      - "8233:8233"
    volumes:
      - temporal-data:/data
    restart: unless-stopped
    networks:
      - burbot
#    healthcheck:
#      test: [
#        "CMD",
#        "temporal",
#        "operator",
#        "cluster",
#        "health",
#        "--adress",
#        "localhost:7233"
#      ]
#      interval: 5s
#      timeout: 5s
#      retries: 10
#      start_period: 15s

  db:
    image: postgres:18.0
    container_name: db
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "${POSTGRES_PORT}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql
    networks:
      - burbot
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}" ]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 10s

volumes:
  temporal-data:
  postgres-data:

networks:
  burbot:
    external: true
    name: burbot