[build-system]
requires = ["hatchling>=1.26"]
build-backend = "hatchling.build"

[project]
name = "burbot-orm"
version = "0.1.0"
description = "PostgreSQL SQLModel persistence layer for Burbot"
requires-python = ">=3.13,<3.15"
dependencies = [
  "alembic>=1.13,<2",
  "psycopg[binary]>=3.2,<4",
  "sqlalchemy>=2.0,<3",
  "sqlmodel>=0.0.22,<1",
]

[project.optional-dependencies]
dev = [
  "pytest>=8,<10",
  "ruff>=0.9,<1",
]

[tool.hatch.build.targets.wheel]
packages = ["schemas"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
